services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 10

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.21.1
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdev@postgres:5432/nakama &&
        exec /nakama/nakama
        --name lighthouse-dev
        --database.address postgres:localdev@postgres:5432/nakama
        --runtime.js_entrypoint "index.js"
        --session.token_expiry_sec 7200
        --console.username admin
        --console.password lighthousedev1
    volumes:
      # js_entrypoint is resolved relative to <data>/modules, not <data>.
      # Only the tsc output is mounted — the server has no business seeing the
      # TypeScript sources or node_modules. Run `npx tsc` in nakama/ first.
      - ./nakama/build:/nakama/data/modules:ro
    ports:
      - "7350:7350"   # client socket/api
      - "7351:7351"   # admin console
    restart: unless-stopped

volumes:
  pgdata:
